 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
    <style>
        body {
            display: grid;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .btn {
            background-color: rgb(15, 102, 189);
            color: rgb(215, 228, 228);

            padding: 10px;
            border: none;
        }
    </style>
</head>

<body>
    <button class="btn">Click me</button>
</body>

</html>
