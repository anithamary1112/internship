<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .input {
            border-radius: 25px;
            justify-content: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 300px);
            column-gap: 100px;
            justify-content: center;
            padding: 20px;

        }

        .title {
            justify-content: center;
            text-align: center;
        }

        .description {
            justify-content: center;
            text-align: center;
            display: block;

        }

        .card {
            background-color: rgb(230, 227, 226);
            border: 1px solid rgb(19, 2, 35);
            padding: 15px;
            width: 300px;
            height: 25vh;
            border-radius: 25px;
            margin-right: auto;
            margin-top: 100px;
            align-items: center;
            column-gap: 60px;
        }

        h2 {
            color: rgba(238, 237, 225, 0.856);
        }

        body {
            display: block;
            flex-direction: column;
            justify-content: center;
            height: 10vh;
            background-color: rgb(20, 16, 11);
        }

        .row {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            background-color: chocolate;
            color: azure;
            padding: 10px;
            border: none;
            border-radius: 50px;
            column-gap: 30px;
        }

        .btn1 {
            background-color: goldenrod;
            color: azure;
            width: 400px;
            padding: 3px;
            border: chocolate;
            outline-style: ridge;
            border-radius: 60px;
            display: block;
            margin: auto;
        }
    </style>

</head>

<body>
    <button class="btn1">
        <h1>Skills & Expertise</h1>
    </button>
    <div class="title">
        <h1 style="color: chocolate"> Technical Skills</h1>
    </div>
    <div class="description">
        <h2>Technologies and tools i used to design and develop modern web solutions</h2>
    </div>

    <div class="container">

        <div class="card">
            <div class="row">
                <img src="frontend.jpeg" width="50" height="50">
                <h1>Frontend</h1>
            </div>
            <div>
                <button class="btn">HTML</button>
                <button class="btn">CSS</button>
                <button class="btn">JavaScript</button>
                <button class="btn">Bootstrap</button>
            </div>
        </div>

        <div class="card">
            <div class="row">
                <img src="backend.jpg" width="50" height="50">
                <h1>Backend/CMS</h1>
            </div>
            <div>
                <button class="btn">WorkPress</button>
                <button class="btn">PHB(basic)</button>
                <button class="btn">MySQL</button>
            </div>
        </div>

        <div class="card">
            <div class="row">
                <img src="design.png" width="50" height="50">
                <h1>Design Tools</h1>
            </div>
            <div>
                <button class="btn">Adobe photoshop</button>
                <button class="btn">Canva</button>
                <button class="btn">Figma</button>
            </div>
        </div>

        <div class="card">
            <div class="row">
                <img src="devtools.jpg" width="90" height="90">
                <h1>Dev Tools</h1>
            </div>
            <div>
                <button class="btn">VSP server</button>
                <button class="btn">GitHub</button>
                <button class="btn">Docker</button>
            </div>
        </div>
    </div>
</body>

</html>
